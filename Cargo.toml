[workspace]
members = ["crates/gutenberg"]
resolver = "2"

[package]
name = "blocksmith"
version = "0.12.0"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "blocksmith"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
sourceview5 = { version = "0.11", features = ["v5_4", "gtk_v4_10"] }
webkit6 = "0.6"
pulldown-cmark = "0.13"
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
ureq = { version = "3", features = ["json"] }
serde_json = "1"
base64 = "0.23"
futures-lite = "2"
libspelling = "0.5"
gutenberg = { path = "crates/gutenberg" }
