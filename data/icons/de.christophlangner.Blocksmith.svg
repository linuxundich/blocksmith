<?xml version="1.0" encoding="UTF-8"?>
<!--
  Blocksmith app icon: a pen forging content on an anvil, in WordPress
  blue - "crafting" WordPress articles is the whole point of the app.
  The circular accent at the pen/anvil meeting point is a deliberately
  restrained nod to WordPress's own roundel, without reproducing its logo.
-->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#25A6DC"/>
      <stop offset="1" stop-color="#0A4D6E"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4F2FA"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>

  <g transform="translate(64 63) scale(1.08) translate(-64 -63)">
    <!-- Anvil, built from a few fused shapes so it reads as one silhouette -->
    <g fill="#22262C">
      <!-- foot -->
      <rect x="24" y="88" width="68" height="17" rx="6"/>
      <!-- waist, tapering from face down to foot -->
      <polygon points="42,72 78,72 71,89 45,89"/>
      <!-- face / table -->
      <rect x="26" y="57" width="62" height="17" rx="8"/>
      <!-- horn -->
      <path d="M 82 59 L 117 64 Q 121 65 117 67 L 82 73 Z"/>
    </g>
    <!-- subtle top highlight on the face -->
    <rect x="30" y="59" width="54" height="4" rx="2" fill="#ffffff" opacity="0.16"/>

    <!-- spark / impact ring at the WordPress-blue accent point -->
    <circle cx="68" cy="60" r="7" fill="none" stroke="#8FD9F7" stroke-width="3.5" opacity="0.9"/>

    <!-- Pen, resting diagonally with its nib at the impact point -->
    <g transform="rotate(45 68 60)">
      <rect x="62" y="-10" width="12" height="12" rx="4" fill="#CFEBF9"/>
      <rect x="63" y="0" width="10" height="46" rx="5" fill="url(#pen)"/>
      <rect x="62" y="44" width="12" height="7" fill="#2B3138"/>
      <path d="M 63 51 L 73 51 L 68 68 Z" fill="#EAF6FC"/>
    </g>
  </g>
</svg>
